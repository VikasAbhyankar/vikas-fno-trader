name: FNO V5 AUTO 184 Stocks - Separate Bot

on:
  schedule:
    - cron: '0,15,30,45 4-9 * * 1-5'
    - cron: '0,15 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install
        run: pip install yfinance pandas ta requests

      - name: Run FNO V5 - All 184
        env:
          TELEGRAM_FNO_BOT_TOKEN: ${{ secrets.TELEGRAM_FNO_BOT_TOKEN }}
          TELEGRAM_FNO_CHAT_ID: ${{ secrets.TELEGRAM_FNO_CHAT_ID }}
        run: python main.py

      - name: Push Reports
        run: |
          git config --global user.name "FNO V5 Auto"
          git config --global user.email "fno-auto@github.com"
          git add reports/
          git commit -m "AUTO FNO V5 184 stocks $(date -u)" || echo "No changes"
          git push
