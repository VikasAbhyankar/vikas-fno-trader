name: FNO V5 DHAN REAL + WA

on:
  schedule:
    - cron: '0,15,30,45 4-9 * * 1-5'
    - cron: '0,15 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install yfinance pandas ta requests pytz
      - env:
          TELEGRAM_FNO_BOT_TOKEN: ${{ secrets.TELEGRAM_FNO_BOT_TOKEN }}
          TELEGRAM_FNO_CHAT_ID: ${{ secrets.TELEGRAM_FNO_CHAT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: python main.py
      - run: |
          git config --global user.name "FNO V5 DHAN"
          git config --global user.email "fno-dhan@github.com"
          git add reports/
          git commit -m "DHAN REAL $(date -u)" || echo "No changes"
          git push
