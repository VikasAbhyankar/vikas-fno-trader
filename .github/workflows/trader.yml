name: FNO V8.1 - Trader - IST
on:
  schedule:
    - cron: '15 4 * * 1-5'   # 9:45 AM IST - MORNING
    - cron: '45 9 * * 1-5'   # 3:15 PM IST - BTST
    - cron: '00 11 * * 1-5'  # 4:30 PM IST - EOD
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install --quiet yfinance pandas numpy requests pytz
      - name: Run V8.1 - 3 Times Only
        run: python main.py
        env:
          TELEGRAM_FNO_BOT_TOKEN: ${{ secrets.TELEGRAM_FNO_BOT_TOKEN }}
          TELEGRAM_FNO_CHAT_ID: ${{ secrets.TELEGRAM_FNO_CHAT_ID }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          UPSTOX_TOKEN_EXPIRY: ${{ secrets.UPSTOX_TOKEN_EXPIRY }}
