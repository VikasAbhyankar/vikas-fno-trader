name: FNO V5 All 184 Stocks - Separate Bot

on:
  schedule:
    - cron: '0,15,30,45 4-9 * * 1-5'
    - cron: '0,15 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          pip install yfinance pandas ta requests
      - env:
          TELEGRAM_FNO_BOT_TOKEN: ${{ secrets.TELEGRAM_FNO_BOT_TOKEN }}
          TELEGRAM_FNO_CHAT_ID: ${{ secrets.TELEGRAM_FNO_CHAT_ID }}
        run: python main.py
      - run: |
          git config --global user.name "FNO V5"
          git config --global user.email "fno@github.com"
          git add reports/
          git commit -m "FNO V5 184 stocks update" || echo "No changes"
          git push
